<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="./assets/css/reset.css" />
        <link rel="stylesheet" href="./assets/css/styles.css" />
        <link
            rel="stylesheet"
            href="https://unpkg.com/aos@2.3.4/dist/aos.css"
        />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
        />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
            rel="stylesheet"
        />
        <title>Celo Bank Project 5</title>
    </head>
    <body>
        <!-- ----------HEADER----------------- -->
        <header class="header">
            <div class="content">
                <div class="header__inner">
                    <a href="#!" class="header__logo-link">
                        <img
                            src="./assets/img/Logo.svg"
                            alt=""
                            class="header__logo-img"
                        />
                    </a>
                    <nav class="header__menu">
                        <ul class="header__list">
                            <li class="header__item">
                                <a
                                    href="#!"
                                    class="header__link header__link--active"
                                    >Home</a
                                >
                            </li>
                            <li class="header__item">
                                <a href="#!" class="header__link">Products</a>
                            </li>
                            <li class="header__item">
                                <a href="#!" class="header__link">Features</a>
                            </li>
                            <li class="header__item">
                                <a href="#!" class="header__link">Blog</a>
                            </li>
                        </ul>
                    </nav>
                    <div class="header__action">
                        <a href="#!" class="header__log-in btn">Log in</a>
                        <a href="#!" class="header_sign-up btn">Sign up</a>
                    </div>
                </div>
            </div>
        </header>
        <div class="test">
            Digital
            <span class="animate__animated animate__pulse animate__infinite"
                >Payment
            </span>
            For Everyone
        </div>
        <!-- AOS JavaScript -->
        <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>

        <!-- Khởi tạo AOS -->
        <script>
            AOS.init({});
        </script>
    </body>
</html>
